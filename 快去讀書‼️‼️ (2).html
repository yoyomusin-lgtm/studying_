 for(let i=0;i<cnt;i++){const a=Math.random()*6.283,sp=2.2+Math.random()*8.5;fxP.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.5,r:3.2+Math.random()*5,c:cols[i%cols.length],life:56+Math.random()*36,rot:Math.random()*6.28,vr:(Math.random()-.5)*.2,sh:kind=='star'?(i%2?2:3):i%4})}
 if(!fxRun){fxRun=1;fxLoop()}}
function fxLoop(){const c=$('#fxc');if(!c||(!fxP.length&&!fxR.length)){fxRun=0;c&&c.getContext('2d').clearRect(0,0,c.width,c.height);return}const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 fxR=fxR.filter(r=>--r.life>0);fxR.forEach(r=>{r.r+=(r.max-r.r)*.16;x.save();x.globalAlpha=r.life/28;x.strokeStyle=r.c;x.lineWidth=3;x.beginPath();x.arc(r.x,r.y,r.r,0,6.283);x.stroke();x.restore()});
 fxP=fxP.filter(p=>--p.life>0);fxP.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.17;p.vx*=.99;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.globalAlpha=Math.min(1,p.life/22);x.fillStyle=p.c;x.beginPath();
  if(p.sh==1)x.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);
  else if(p.sh==2){const r=p.r*1.9;x.moveTo(0,-r);x.quadraticCurveTo(0,0,r,0);x.quadraticCurveTo(0,0,0,r);x.quadraticCurveTo(0,0,-r,0);x.quadraticCurveTo(0,0,0,-r);x.fill()}
  else if(p.sh==3){const r=p.r*1.4;x.moveTo(0,-r);x.lineTo(r*.8,0);x.lineTo(0,r);x.lineTo(-r*.8,0);x.closePath();x.fill()}

  x.restore()});requestAnimationFrame(fxLoop)}

async function syncSocialGraph(){
 if(!S||!S.u)return;
 let changed=false;
 const checkUserDoc=async(d)=>{
  if(!d||!d.u||d.u===S.u)return;
  const rE=calcRecEarned(d);
  if((d.tot||0)<rE||((d.draws||0)===0&&(d.pts||0)<rE)){
   d.tot=Math.max(d.tot||0,rE);
   if((d.draws||0)===0)d.pts=Math.max(d.pts||0,rE);
   await patchU(d.u,x=>{
    const rx=calcRecEarned(x);
    if((x.tot||0)<rx)x.tot=rx;
    if((x.draws||0)===0&&(x.pts||0)<rx)x.pts=rx;
    if(Array.isArray(x.groups)&&x.groups[0])x.groups[0]._t=Date.now();
   });
  }
  LDB[d.u]=d;
  /* 1. If this user has S.u in their friends list, restore them to S.friends! */
  if(Array.isArray(d.friends)&&d.friends.some(x=>x&&x.u&&x.u.toLowerCase()===S.u.toLowerCase())){
   S.friends=S.friends||[];
   if(!S.friends.some(x=>x&&x.u===d.u)){
    S.friends.push({u:d.u,av:d.av||'',bio:d.bio||''});
    changed=true;
   }
  }
  /* 2. If this user has any groups where S.u is in seats (or name/code matches), restore that group to S.groups and sync to _grp_! */
  if(Array.isArray(d.groups)){
   for(const g of d.groups){
    if(!g||!g.code)continue;
    const ng=normG(g);
    LGP[ng.code]=ng;
    if(ng.seats.some(u=>u&&u.toLowerCase()===S.u.toLowerCase())){
     S.groups=S.groups||[];
     const ix=S.groups.findIndex(x=>x&&x.code===ng.code);
     if(ix<0){S.groups.push(ng);changed=true}
     else{S.groups[ix]=ng}
     await saveG(ng);
    }
   }
  }
 };
 try{
  /* Check known friend '小龍3' directly via GET (always allowed by Firestore even if collection list is restricted) */
  for(const kn of ['小龍3']){
   if(kn!==S.u){try{const d=await getU(kn);if(d)await checkUserDoc(d)}catch(e){}}
  }
  /* Also scan users collection & _sys_ulist */
  const ur='https://firestore.googleapis.com/v1/projects/study-42a70/databases/(default)/documents/users?pageSize=200&key=AIzaSyD4Pa45bWfdR3poryNK2Xdm-WqED6as_Mw';
  const r=await fto(ur);
  if(r.ok){
   const j=await r.json();
   for(const doc of (j.documents||[])){
    const nm=decodeURIComponent(doc.name.split('/').pop());
    if(nm.startsWith('_grp_')){
     try{
      const g=normG(JSON.parse(doc.fields.d.stringValue));
      if(g&&g.code){
       LGP[g.code]=g;
       if(g.seats.some(u=>u&&u.toLowerCase()===S.u.toLowerCase())){
        S.groups=S.groups||[];
        if(!S.groups.some(x=>x&&x.code===g.code)){S.groups.push(g);changed=true}
       }
      }
     }catch(e){}
    }else if(!nm.startsWith('_sys_')){
     try{const d=JSON.parse(doc.fields.d.stringValue);await checkUserDoc(d)}catch(e){}
    }
   }
  }
 }catch(e){}
 ldbSet(LDB_K,LDB);ldbSet(LGP_K,LGP);
 if(changed){save();rr()}
}

 SUB.forEach(s=>{let ls=[],pt=0;ds.forEach(k=>{const x=((S.work[k]||{})[s])||{},p=(x.q||0)*R[s][0]+(x.b||0)*R[s][1]+(x.e||0)*R[s][2];if(p>0){pt+=p;ls.push(lbl(k)+'：'+(x.q||0)+' 題'+(x.b?'、'+x.b+' 本':'')+(x.e?'、作文 '+x.e+' 篇':'')+'（'+p+' 分）')}});
  h+=`<button class="o" onclick="ac('s_${s}',this)" style="margin:4px 0;width:100%;text-align:left">${s}　本週 ${pt} 分<i class="ar"></i></button><div id="s_${s}" class="in" style="display:none">${ls.length?ls.map(l=>'<div>'+l+'</div>').join(''):'<small>本週尚無做題紀錄</small>'}</div>`});
 $('#vw').innerHTML=h+'</div></div></div>'}
function ac(id,b){const e=$('#'+id),o=e.style.display=='none';e.style.display=o?'block':'none';OP[id]=o;b&&b.classList.toggle('open',o)}

/* ---------- timers (capped at 24h/day) & diary ---------- */
let TM=null;
function go2(t){cl();const f=()=>{if(T!==t){clearOP();wipe();sfx('swipe')}T=t;user()};if(!tmGuard(f))f()}
function tmGuard(fn){if(TM&&TM.run){ask('退出即失敗，確定退出嗎？',()=>{tmFail();fn()});return true}return false}
function addLog(m){if(m<=0)return;const t=dk(now()),rem=1440-mins(t),add=Math.min(m,Math.max(0,rem));if(add<=0)return;(S.logs[t]=S.logs[t]||[]).push({t:hm(),m:add});save()}
function tmFail(){if(!TM)return;clearInterval(TM.iv);TM=null;S.studying=0;save();sfx('err');toast('專注失敗','這次專注不算數，下次加油！');if(V=='user'&&(T=='pom'||T=='sw'))tmView(T)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&TM&&TM.run&&TM.lock)tmFail()});
function tmStart(k){if(mins(dk(now()))>=1440){sfx('err');mdl('<p style="text-align:center;color:#b00020;font-weight:700">今日讀書時間已滿 24 小時上限！</p>');return}
 const lock=$('#lk').checked;S.studying=1;save();if(k=='sw')TM={k,run:1,t0:Date.now(),sec:0,lock};else{const fm=Math.max(1,+$('#pf').value||25),bm=Math.max(1,+$('#pb').value||5),n=Math.max(1,+$('#pn').value||4);TM={k,run:1,ph:'f',cur:1,n,fm,bm,done:0,end:Date.now()+fm*60000,sec:fm*60,lock}}TM.iv=setInterval(tmTick,500);tmView(k)}
function tmTick(){if(!TM||!TM.run)return;const t=Date.now();if(TM.k=='sw')TM.sec=Math.floor((t-TM.t0)/1000);else{const l=Math.ceil((TM.end-t)/1000);TM.sec=Math.max(0,l);if(l<=0){tmNext();return}}
 const e=$('#tmv');if(e){const s=TM.sec,p=v=>String(v).padStart(2,'0');e.textContent=TM.k=='sw'?Math.floor(s/3600)+':'+p(Math.floor(s%3600/60))+':'+p(s%60):p(Math.floor(s/60))+':'+p(s%60);const g=$('#rg');if(g){const r=TM.k=='sw'?(s%3600)/3600:1-s/((TM.ph=='f'?TM.fm:TM.bm)*60);g.style.strokeDashoffset=339.3*(1-r)}}}
function tmNext(){if(TM.ph=='f'){addLog(TM.fm);S.maxF=Math.max(S.maxF||0,TM.fm);TM.done+=TM.fm;if(TM.cur>=TM.n){clearInterval(TM.iv);TM.run=0;TM.fin=TM.done;S.studying=0;save();sfx('reward');fxBurst();toast('完成！','共專注 '+TM.done+' 分鐘，已加到本日讀書時間');if(V=='user'&&T=='pom')tmView('pom');return}TM.ph='b';TM.end=Date.now()+TM.bm*60000;sfx('win');toast('休息一下','休息 '+TM.bm+' 分鐘')}else{TM.cur++;TM.ph='f';TM.end=Date.now()+TM.fm*60000;sfx('pop');toast('開始專注','第 '+TM.cur+' 回')}if(V=='user'&&T=='pom')tmView('pom')}
function swEnd(){const m=Math.floor(TM.sec/60);addLog(m);S.maxF=Math.max(S.maxF||0,m);clearInterval(TM.iv);TM.run=0;TM.fin=m;S.studying=0;save();sfx('reward');fxBurst();tmView('sw')}
function tmQuit(){tmGuard(()=>tmView(T))}
function tmView(k){const t=TM&&TM.k==k?TM:null,v=$('#vw');if(!v)return;
 if(t&&t.run){v.innerHTML=`<div class="wrap" style="text-align:center"><div class="mu">${k=='pom'?(t.ph=='f'?'專注中　第 '+t.cur+' / '+t.n+' 回':'休息中'):'正計時中'}</div><div class="ring pulse"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--bg3)" stroke-width="8"/><circle id="rg" cx="60" cy="60" r="54" fill="none" stroke="var(--g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .5s linear"/></svg><div id="tmv"></div></div><p class="mu">${t.lock?'鎖機中：離開 App 會判定專注失敗':''}</p>${k=='sw'?'<button onclick="swEnd()">結束並記錄</button> ':''}<button class="o" onclick="tmQuit()">放棄</button></div>`;tmTick();return}
 if(t&&t.fin!=null){v.innerHTML=`<div class="wrap" style="text-align:center"><div class="card"><div style="font-size:22px;font-weight:700">完成！</div><p>已把 ${t.fin} 分鐘加到本日讀書時間</p><button onclick="TM=null;tmView('${k}')">再來一次</button></div></div>`;return}
 v.innerHTML=`<div class="wrap"><div class="card"><b>${k=='pom'?'番茄鐘':'正計時'}</b><p class="mu">${k=='pom'?'專注＋休息循環，時間和回數自己設定':'正計時不設時間上限，結束時記錄（每天最多記錄 24 小時）'}</p>${k=='pom'?'<div class="row" style="margin:10px 0"><label style="flex:1"><small>專注（分）</small><input id="pf" type="number" min="1" value="25"></label><label style="flex:1"><small>休息（分）</small><input id="pb" type="number" min="1" value="5"></label><label style="flex:1"><small>回數</small><input id="pn" type="number" min="1" value="4"></label></div>':''}<label class="row"><input type="checkbox" id="lk" checked style="width:22px;height:22px"> 鎖機模式（離開 App 即專注失敗）</label><br><button style="width:100%" onclick="tmStart('${k}')">開始</button></div></div>`}
function pom(){tmView('pom')}function sw(){tmView('sw')}

let DM=null;const ILL='<svg width="120" height="90" viewBox="0 0 120 90" fill="none" stroke="#7A8B7E" stroke-width="3" stroke-linejoin="round"><path d="M60 22C46 14 28 14 14 20v52c14-6 32-6 46 2 14-8 32-8 46-2V20C92 14 74 14 60 22Z"/><path d="M60 22v52"/><path d="M96 6l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" stroke="#D8C8B8"/></svg>';
function diary(){const n=now();if(!DM)DM={y:n.getFullYear(),m:n.getMonth()};const f=new Date(DM.y,DM.m,1),dn=new Date(DM.y,DM.m+1,0).getDate(),tk=dk(n);
 let g=WD.split('').map(w=>`<div class="mu" style="text-align:center">${w}</div>`).join('');for(let i=0;i<f.getDay();i++)g+='<div></div>';
 for(let d=1;d<=dn;d++){const k=dk(new Date(DM.y,DM.m,d)),w=S.work[k],has=mins(k)>0||(w&&Object.keys(w).length);g+=`<button class="o dy ${k==tk?'tdy':''}" onclick="dayLog('${k}')">${d}${has?'<i class="dt"></i>':''}</button>`}
 const v=$('#vw');v.innerHTML=`<div class="wrap"><div class="row sp"><button class="o sm" onclick="dmv(-1)" aria-label="上個月">‹</button><b>${DM.y} 年 ${DM.m+1} 月</b><button class="o sm" onclick="dmv(1)" aria-label="下個月">›</button></div><div class="cal">${g}</div><p class="mu" style="text-align:center">左右滑動切換月份，點日期看當天日誌</p></div>`;
 let x0=0;v.ontouchstart=e=>{x0=e.touches[0].clientX};v.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)dmv(d<0?1:-1)}}
function dmv(d){DM.m+=d;if(DM.m<0){DM.m=11;DM.y--}if(DM.m>11){DM.m=0;DM.y++}diary()}
function dayLog(k){const m=mins(k),pts=S.days[k]?S.days[k].p:calc(k).p,w=S.work[k]||{};let L='',ph=[];
 SUB.forEach(s=>{const x=w[s];if(x&&(x.list||[]).length){L+=`<div style="margin:6px 0"><b>${s}</b>`+x.list.map(l=>`<div class="mu">${l.t}　${l.q||0} 題 ${l.b||0} 本${l.e?'　'+l.e+' 篇作文':''}</div>`).join('')+'</div>';x.list.forEach(l=>l.ph&&ph.push(l.ph))}});
 let P={};try{P=JSON.parse(localStorage.getItem('g116p')||'{}')}catch(e){}
 const im=ph.slice(0,3).filter(i=>P[i]).map(i=>`<img src="${P[i]}" alt="" style="width:31%;border-radius:8px;aspect-ratio:1;object-fit:cover">`).join('');
 mdl(`<h3 style="text-align:center">${lbl(k)}</h3><div style="text-align:center"><div>讀了 <b>${mm(m)}</b></div><div>拿了 <b>${pts>0?'+':''}${pts}</b> 分${S.days[k]?'':'（今天還沒結算）'}</div></div><hr>${L||'<p class="mu" style="text-align:center">這天沒有做題紀錄</p>'}<div class="row" style="justify-content:center;margin-top:10px">${im||ILL}</div>`)}
